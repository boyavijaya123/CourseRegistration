
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Course</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="update">
<header>
    <h1>Update Course Details</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/courses.html">View Courses</a>
        <a href="/manage-courses.html">Manage Courses</a>
    </nav>
</header>

<main>
    <h2>Modify Existing Course</h2>
    <img class="page-image"
         src="https://placehold.co/1000x200/183b66/ffffff?text=Update+Course"
         alt="Updating a college course">

    <p id="message" class="message" hidden></p>

    <form id="courseForm">
        <label for="course_code">Course Code</label>
        <input id="course_code" name="course_code" maxlength="20" required>

        <label for="course_name">Course Name</label>
        <input id="course_name" name="course_name" maxlength="100" required>

        <label for="course_credits">Course Credits</label>
        <input id="course_credits" name="course_credits"
               type="number" min="1" required>

        <label for="department">Department</label>
        <input id="department" name="department" maxlength="50" required>

        <label for="semester">Semester</label>
        <input id="semester" name="semester"
               type="number" min="1" max="12" required>

        <button type="submit">Update Course</button>
        <a class="btn" href="/manage-courses.html">Cancel</a>
    </form>
</main>

<footer><p>Course Administration</p></footer>
<script src="/js/app.js"></script>
</body>
</html>
